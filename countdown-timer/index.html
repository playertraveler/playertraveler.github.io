<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="timer-app">
      <h1>Countdown Timer</h1>

      <section class="inputs" aria-label="Timer input">
        <label>
          Minutes
          <input id="minutes" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label>
          Seconds
          <input id="seconds" type="number" min="0" max="59" step="1" inputmode="numeric" />
        </label>
      </section>

      <p id="display" class="display" aria-live="polite">00:00</p>
      <p id="message" class="message" aria-live="polite"></p>

      <section class="buttons" aria-label="Timer controls">
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button">Stop</button>
        <button id="reset-btn" type="button">Reset</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
